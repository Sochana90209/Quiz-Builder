<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — Quiz Builder</title>
<meta name="description" content="Log in to Quiz Builder to create and manage your quizzes." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" />
<link rel="stylesheet" href="../Shared/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header data-topbar></header>

<main id="main" class="shell shell-narrow">
  <div class="text-center" style="margin-bottom:18px">
    <h1>Welcome back</h1>
    <p>Log in to build quizzes, share codes and track results.</p>
  </div>

  <section class="card">
    <div class="alert alert-error" id="formError" role="alert" hidden></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
        <p class="error-text" id="emailError" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <p class="error-text" id="passwordError" aria-live="polite"></p>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">Log in</button>
    </form>
    <p class="text-center muted" style="margin:16px 0 0">
      New here? <a href="signup.html">Create an account</a>
    </p>
  </section>

  <section class="card text-center">
    <h2 style="font-size:1.1rem">Taking a quiz?</h2>
    <p class="mb-0">No account needed — just enter the quiz code your teacher shared.</p>
    <p style="margin-top:14px" class="mb-0">
      <a class="btn btn-secondary" href="../User/join.html">Join with a code</a>
    </p>
  </section>
</main>

<script src="../Shared/storage.js"></script>
<script src="../Shared/app.js"></script>
<script>
(function () {
  QB.renderTopbar();
  if (QBStorage.getSession()) { QB.go(QB.PATHS.dashboard); return; }

  var form = QB.$("#loginForm");
  var formError = QB.$("#formError");

  function setError(id, msg) { QB.$(id).textContent = msg || ""; }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    formError.hidden = true;
    setError("#emailError", ""); setError("#passwordError", "");

    var email = QB.$("#email").value.trim();
    var password = QB.$("#password").value;
    var bad = false;
    if (!email) { setError("#emailError", "Email is required."); bad = true; }
    if (!password) { setError("#passwordError", "Password is required."); bad = true; }
    if (bad) return;

    var res = QBStorage.login(email, password);
    if (!res.ok) {
      formError.textContent = res.error;
      formError.hidden = false;
      return;
    }
    QB.toast("Welcome back, " + res.user.name + "!");
    QB.go(QB.PATHS.dashboard);
  });
})();
</script>
</body>
</html>
