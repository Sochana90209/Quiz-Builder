<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create account — Quiz Builder</title>
<meta name="description" content="Create a free Quiz Builder account and start making quizzes." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" />
<link rel="stylesheet" href="../Shared/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header data-topbar></header>

<main id="main" class="shell shell-narrow">
  <div class="text-center" style="margin-bottom:18px">
    <h1>Create your account</h1>
    <p>Everything is stored safely in this browser — no setup required.</p>
  </div>

  <section class="card">
    <div class="alert alert-error" id="formError" role="alert" hidden></div>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" maxlength="60" required />
        <p class="error-text" id="nameError" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
        <p class="error-text" id="emailError" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required />
        <p class="hint">At least 6 characters.</p>
        <p class="error-text" id="passwordError" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required />
        <p class="error-text" id="confirmError" aria-live="polite"></p>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="signupSubmit">Create account</button>
    </form>
    <p class="text-center muted" style="margin:16px 0 0">
      Already have an account? <a href="index.html">Log in</a>
    </p>
  </section>
</main>

<script src="../Shared/storage.js"></script>
<script src="../Shared/app.js"></script>
<script>
(function () {
  QB.renderTopbar();
  if (QBStorage.getSession()) { QB.go(QB.PATHS.dashboard); return; }

  var form = QB.$("#signupForm");
  var formError = QB.$("#formError");
  function setError(id, msg) { QB.$(id).textContent = msg || ""; }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    formError.hidden = true;
    ["#nameError", "#emailError", "#passwordError", "#confirmError"].forEach(function (id) { setError(id, ""); });

    var name = QB.$("#name").value.trim();
    var email = QB.$("#email").value.trim();
    var password = QB.$("#password").value;
    var confirm = QB.$("#confirm").value;
    var bad = false;

    if (!name) { setError("#nameError", "Please enter your name."); bad = true; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { setError("#emailError", "Enter a valid email address."); bad = true; }
    if (password.length < 6) { setError("#passwordError", "Use at least 6 characters."); bad = true; }
    if (password !== confirm) { setError("#confirmError", "Passwords do not match."); bad = true; }
    if (bad) return;

    var res = QBStorage.signup(name, email, password);
    if (!res.ok) { formError.textContent = res.error; formError.hidden = false; return; }
    QB.toast("Account created. Let's build a quiz!");
    QB.go(QB.PATHS.dashboard);
  });
})();
</script>
</body>
</html>
